services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20
  pull-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ollama]
    command: [pull, "${SANKET_OLLAMA_MODEL:-qwen3:8b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
  api:
    environment:
      SANKET_OLLAMA_URL: http://ollama:11434
  worker:
    environment:
      SANKET_OLLAMA_URL: http://ollama:11434
volumes:
  ollama_data:
