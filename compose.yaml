name: sanketai

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &backend-env
    SANKET_DATABASE_URL: postgresql+psycopg://sanket:${POSTGRES_PASSWORD:?Run python scripts/setup_env.py}@db:5432/sanketai
    SANKET_FRONTEND_ORIGIN: ${SANKET_FRONTEND_ORIGIN:-http://localhost:5173}
    SANKET_OLLAMA_URL: http://host.docker.internal:11434
  extra_hosts:
    - host.docker.internal:host-gateway
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sanket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_env.py}
      POSTGRES_DB: sanketai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sanket -d sanketai]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 127.0.0.1:5173:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
